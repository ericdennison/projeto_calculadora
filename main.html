<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="janela_calculadora">

        <div class="visor">

            <textarea name="area_visor" class="area_visor"></textarea>
            

        </div>

        <div class="teclado">
            
            <div class="botoes">

                <div class="botoes_numericos">
                    <button class="7">7</button>
                    <button>8</button>
                    <button>9</button>
                    <button>4</button>
                    <button>5</button>
                    <button>6</button>
                    <button>3</button>
                    <button>2</button>
                    <button>1</button>
                    <button>0</button>
                </div>

                <div class="botoes_caracteres">
                    <button>C</button>
                    <button>⌫</button>
                    <button>/</button>
                    <button>*</button>
                    <button>.</button>
                    <button>%</button>
                </div>
                

             </div>

        </div>
    </div>
</body>
</html>
